name: Claude native contract
on:
  workflow_call:
    inputs:
      candidate_version:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  native:
    name: Claude native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      DISABLE_UPDATES: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify and stage the exact candidate
        id: candidate
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          if [ -n "$CANDIDATE_VERSION" ]; then
            node scripts/claude-compat.mjs add-version "$CANDIDATE_VERSION"
            claude_target_version="$CANDIDATE_VERSION"
          else
            claude_target_version=$(node scripts/claude-compat.mjs latest-tested)
          fi
          node scripts/claude-compat.mjs install "$claude_target_version" "$RUNNER_TEMP/verified-claude"
          echo "$RUNNER_TEMP/verified-claude" >> "$GITHUB_PATH"
          echo "version=$claude_target_version" >> "$GITHUB_OUTPUT"
      - name: Offline cleanup, restore and both resume routes
        env:
          INFINITE_DISK_NATIVE_CLAUDE_TEST: '1'
          INFINITE_DISK_NATIVE_CLAUDE_SESSION_VERSION: ${{ steps.candidate.outputs.version }}
        run: go test ./internal/disk -run '^TestNativeClaudeOfflineCleanup$' -count=1 -v
